name: Atualizar concursos

on:
  schedule:
    - cron: "0 9,15,21 * * *"  # 6h, 12h e 18h em Recife
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["extrator/**", "tests/**", "requirements.txt"]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m extrator.concursos docs/data/concursos.json
      - name: Publicar dados novos
        run: |
          git config user.name "oconcurseiro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/concursos.json
          git diff --cached --quiet || git commit -m "dados: atualização automática dos concursos"
          git push
